<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Neón & Gloss Gradients -->
    <linearGradient id="neonGreenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ADE80"/>
      <stop offset="50%" stop-color="#22C55E"/>
      <stop offset="100%" stop-color="#15803D"/>
    </linearGradient>
    <linearGradient id="darkBgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#18181B"/>
      <stop offset="100%" stop-color="#09090B"/>
    </linearGradient>
    <linearGradient id="speedOrange" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF4500"/>
      <stop offset="100%" stop-color="#FF6B00"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Círculo Base Fondo Oscuro con Anillo Neón Verde -->
  <circle cx="250" cy="250" r="230" fill="url(#darkBgGrad)" stroke="url(#neonGreenGrad)" stroke-width="14" filter="url(#neonGlow)"/>
  <circle cx="250" cy="250" r="212" fill="none" stroke="#22C55E" stroke-width="3" stroke-dasharray="8 6"/>

  <!-- Líneas de Velocidad Horizontales -->
  <path d="M 40 210 L 170 210 M 30 235 L 150 235 M 45 260 L 180 260 M 35 285 L 160 285" stroke="#4ADE80" stroke-width="4" stroke-linecap="round" opacity="0.75"/>

  <!-- Silueta del Repartidor en Motocicleta en Movimiento -->
  <g transform="translate(110, 80) scale(0.68)">
    <!-- Caja de Reparto con Pizza -->
    <rect x="50" y="80" width="110" height="110" rx="14" fill="#15803D" stroke="#4ADE80" stroke-width="6"/>
    <circle cx="105" cy="135" r="32" fill="#FF4500" stroke="#FFFFFF" stroke-width="4"/>
    <!-- Porciones de Pizza en Mochila -->
    <path d="M 105 135 L 105 105 A 30 30 0 0 1 130 120 Z" fill="#FACC15"/>
    <path d="M 105 135 L 130 145 A 30 30 0 0 1 105 165 Z" fill="#FACC15"/>
    <path d="M 105 135 L 85 155 A 30 30 0 0 1 78 125 Z" fill="#FACC15"/>

    <!-- Motocicleta de Carreras / Scooter -->
    <path d="M 130 220 L 220 120 L 310 140 L 360 190 L 320 230 L 200 240 Z" fill="#22C55E" stroke="#FFFFFF" stroke-width="5"/>
    <!-- Rueda Delantera -->
    <circle cx="340" cy="240" r="50" fill="#18181B" stroke="#4ADE80" stroke-width="12"/>
    <circle cx="340" cy="240" r="22" fill="#9CA3AF"/>
    <!-- Rueda Trasera -->
    <circle cx="150" cy="250" r="45" fill="#18181B" stroke="#4ADE80" stroke-width="10"/>
    <circle cx="150" cy="250" r="20" fill="#9CA3AF"/>

    <!-- Casco y Repartidor Inclinado -->
    <circle cx="230" cy="80" r="36" fill="#22C55E" stroke="#FFFFFF" stroke-width="5"/>
    <path d="M 210 75 Q 240 65 260 85 Q 230 95 210 75 Z" fill="#E5E7EB"/> <!-- Visera -->
    <path d="M 200 110 C 230 100 270 120 280 160 L 220 180 Z" fill="#15803D" stroke="#FFFFFF" stroke-width="4"/> <!-- Cuerpo -->
  </g>

  <!-- Tipografía NÉSTOR PIZZAS -->
  <g transform="translate(250, 400)">
    <!-- Banner Contenedor Oscuro de Texto -->
    <path d="M -180 -50 L 180 -50 L 160 30 L -160 30 Z" fill="#09090B" stroke="#22C55E" stroke-width="5" filter="url(#neonGlow)"/>
    
    <!-- Texto NESTOR (Itálica Gruesa Deportiva) -->
    <text x="0" y="-12" text-anchor="middle" font-family="'Outfit', 'Arial Black', sans-serif" font-size="52" font-weight="900" font-style="italic" fill="#FFFFFF" stroke="#18181B" stroke-width="3" letter-spacing="4">NESTOR</text>
    
    <!-- Píldora Verde PIZZAS -->
    <rect x="-85" y="0" width="170" height="34" rx="8" fill="url(#neonGreenGrad)"/>
    <text x="0" y="24" text-anchor="middle" font-family="'Outfit', 'Arial Black', sans-serif" font-size="24" font-weight="900" font-style="italic" fill="#FFFFFF" letter-spacing="3">PIZZAS</text>
  </g>
</svg>
